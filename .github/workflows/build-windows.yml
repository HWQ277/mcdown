name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.3.0"
        required: true
        default: "v1.3.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name MCDown mcdown.py
          if (-not (Test-Path "dist\MCDown.exe")) { throw "MCDown.exe was not produced" }
          Get-Item "dist\MCDown.exe" | Format-List Name, Length, FullName
          Get-FileHash "dist\MCDown.exe" -Algorithm SHA256 | Format-List

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCDown-windows
          path: dist/MCDown.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          $hash = (Get-FileHash "dist\MCDown.exe" -Algorithm SHA256).Hash.ToLower()
          @"
          Windows 单文件发行版。

          - 版本：mcdown 1.3.0
          - 构建环境：GitHub Actions / windows-latest / PyInstaller
          - 文件：MCDown.exe
          - SHA-256：$hash

          该 EXE 未做代码签名，Windows SmartScreen 可能提示“未知发布者”。请核对 SHA-256 后运行。

          源代码与许可证：https://github.com/HWQ277/mcdown
          "@ | Out-File -FilePath release-notes.md -Encoding utf8

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "dist\MCDown.exe" --clobber
          } else {
            gh release create $tag "dist\MCDown.exe" `
              --title "mcdown $tag" `
              --notes-file release-notes.md `
              --target "$env:GITHUB_SHA"
          }
